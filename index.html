<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرصد أونو لا ترحم</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 8px; 
            /* منع التحديد باللمس لتسريع الاستجابة */
            user-select: none; 
            -webkit-user-select: none; 
        }

        h2 { color: #f39c12; margin: 10px 0; text-align: center; font-size: 1.5rem; }
        
        /* تنسيق شاشات الإعداد */
        .setup-container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            margin-top: 20px;
        }
        
        input { 
            width: 100%; padding: 10px; margin: 8px 0; 
            border-radius: 8px; border: 1px solid #444; 
            background: #2c2c2c; color: #fff; font-size: 16px; 
            box-sizing: border-box; text-align: center;
        }
        
        .main-btn { 
            width: 100%; padding: 12px; border-radius: 10px; 
            border: none; background: #27ae60; color: white; 
            font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; 
        }

        /* --- تصميم الشبكة (Grid) الجديد --- */
        #playersList {
            display: grid;
            grid-template-columns: 1fr 1fr; /* عمودين متساويين */
            gap: 8px; /* مسافة صغيرة بين الكروت */
        }

        .player-card {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 12px;
            border-top: 4px solid #f39c12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 140px; /* ارتفاع ثابت لتوحيد الشكل */
            position: relative;
        }

        .player-name { 
            font-size: 1rem; 
            font-weight: bold; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 100%;
            margin-bottom: 5px;
        }
        
        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%;
        }

        /* تكبير الأزرار قليلاً للمس */
        .btn-circle { 
            width: 45px; height: 45px; 
            border-radius: 50%; border: none; 
            font-size: 22px; color: white; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; 
            /* تأثير الظل */
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .btn-plus { background: #c0392b; }
        .btn-minus { background: #2980b9; }
        
        .card-count { font-size: 1.8rem; font-weight: bold; width: 40px; text-align: center; }
        
        /* تأثير الخسارة */
        .out-msg { 
            background: #800000 !important; 
            border-color: #ff0000 !important;
            animation: shake 0.5s; 
        }
        .out-text { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: red; font-weight: 900;
            display: none; align-items: center; justify-content: center;
            font-size: 2rem; border-radius: 10px; z-index: 10;
        }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(3px); } 50% { transform: translateX(-3px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>

    <h2>🃏 العداد المرعب</h2>

    <div id="setup" class="setup-container">
        <label>عدد اللاعبين</label>
        <input type="number" id="playerCount" min="2" max="6" value="4">
        <button class="main-btn" onclick="showNameInputs()">التالي</button>
    </div>

    <div id="namesArea" class="setup-container" style="display:none;">
        <div id="nameFields"></div>
        <button class="main-btn" onclick="startGame()">ابدأ الجلد!</button>
    </div>

    <div id="gameArea" style="display:none;">
        <div id="playersList"></div>
        <button class="main-btn" onclick="location.reload()" style="background: #555; margin-top: 15px;">لعبة جديدة 🔄</button>
    </div>

    <script>
        function showNameInputs() {
            const count = document.getElementById('playerCount').value;
            let html = '';
            for(let i=1; i<=count; i++) {
                html += `<input type="text" id="name${i}" placeholder="لاعب ${i}">`;
            }
            document.getElementById('nameFields').innerHTML = html;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('namesArea').style.display = 'block';
        }

        function startGame() {
            const count = document.getElementById('playerCount').value;
            let html = '';
            for(let i=1; i<=count; i++) {
                const name = document.getElementById(`name${i}`).value || `لاعب ${i}`;
                html += `
                    <div class="player-card" id="card${i}">
                        <div class="out-text" id="out${i}">X</div>
                        <div class="player-name">${name}</div>
                        <div class="controls">
                            <button class="btn-circle btn-minus" onclick="changeCount(${i}, -1)">-</button>
                            <span class="card-count" id="count${i}">7</span>
                            <button class="btn-circle btn-plus" onclick="changeCount(${i}, 1)">+</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('playersList').innerHTML = html;
            document.getElementById('namesArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
        }

        function changeCount(id, delta) {
            const countEl = document.getElementById(`count${id}`);
            const cardEl = document.getElementById(`card${id}`);
            const outEl = document.getElementById(`out${id}`);
            
            let current = parseInt(countEl.innerText);
            
            // منع النزول تحت الصفر
            if (current + delta < 0) return;

            current += delta;
            countEl.innerText = current;

            if (current >= 25) {
                cardEl.classList.add('out-msg');
                outEl.style.display = 'flex'; // إظهار علامة X الكبيرة
            } else {
                cardEl.classList.remove('out-msg');
                outEl.style.display = 'none';
            }
        }
    </script>
</body>
</html>
