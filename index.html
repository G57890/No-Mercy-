<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مرصد أونو لا ترحم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
        h2 { color: #f39c12; margin-bottom: 20px; text-align: center; }
        
        .setup-container { background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        input[type="number"], input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: #fff; font-size: 16px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #27ae60; color: white; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
        
        .player-row { background: #1e1e1e; padding: 15px; margin-bottom: 12px; border-radius: 12px; border-right: 5px solid #f39c12; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .player-header { display: flex; justify-content: space-between; align-items: center; }
        .player-name { font-size: 1.2rem; font-weight: bold; }
        
        .controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 24px; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-plus { background: #c0392b; }
        .btn-minus { background: #2980b9; }
        .card-count { font-size: 2rem; font-weight: bold; min-width: 50px; text-align: center; }
        
        .out-msg { background: #ff0000; border: 3px solid #fff; animation: blink 0.5s infinite alternate; }
        .out-text { color: #ff0000; font-weight: bold; display: none; text-align: center; margin-top: 5px; font-size: 1.1rem; }
        
        @keyframes blink { from { opacity: 1; } to { opacity: 0.7; } }
    </style>
</head>
<body>

    <h2>🃏 أونو لا ترحم</h2>

    <div id="setup" class="setup-container">
        <label>كم عدد اللاعبين؟ (2-6)</label>
        <input type="number" id="playerCount" min="2" max="6" value="2">
        <button onclick="showNameInputs()">التالي</button>
    </div>

    <div id="namesArea" class="setup-container" style="display:none;">
        <div id="nameFields"></div>
        <button onclick="startGame()">ابدأ اللعب!</button>
    </div>

    <div id="gameArea" style="display:none;">
        <div id="playersList"></div>
        <button onclick="location.reload()" style="background: #555; margin-top: 20px;">لعبة جديدة 🔄</button>
    </div>

    <script>
        function showNameInputs() {
            const count = document.getElementById('playerCount').value;
            let html = '';
            for(let i=1; i<=count; i++) {
                html += `<input type="text" id="name${i}" placeholder="اسم اللاعب ${i}">`;
            }
            document.getElementById('nameFields').innerHTML = html;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('namesArea').style.display = 'block';
        }

        function startGame() {
            const count = document.getElementById('playerCount').value;
            let html = '';
            for(let i=1; i<=count; i++) {
                const name = document.getElementById(`name${i}`).value || `لاعب ${i}`;
                html += `
                    <div class="player-row" id="row${i}">
                        <div class="player-header">
                            <span class="player-name">${name}</span>
                        </div>
                        <div class="controls">
                            <button class="btn-circle btn-minus" onclick="changeCount(${i}, -1)">-</button>
                            <span class="card-count" id="count${i}">7</span>
                            <button class="btn-circle btn-plus" onclick="changeCount(${i}, 1)">+</button>
                        </div>
                        <div class="out-text" id="out${i}">❌ اطللللللع برااااا! ❌</div>
                    </div>
                `;
            }
            document.getElementById('playersList').innerHTML = html;
            document.getElementById('namesArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
        }

        function changeCount(id, delta) {
            const countEl = document.getElementById(`count${id}`);
            const rowEl = document.getElementById(`row${id}`);
            const outText = document.getElementById(`out${id}`);
            
            let current = parseInt(countEl.innerText);
            current = Math.max(0, current + delta); // لا ينزل تحت الصفر
            
            countEl.innerText = current;

            if (current >= 25) {
                rowEl.classList.add('out-msg');
                outText.style.display = 'block';
            } else {
                rowEl.classList.remove('out-msg');
                outText.style.display = 'none';
            }
        }
    </script>
</body>
</html>
